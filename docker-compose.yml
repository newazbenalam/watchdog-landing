services:
  watchlog-landing:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APK_DOWNLOAD_URL: ${NEXT_PUBLIC_APK_DOWNLOAD_URL:-/app-release.apk}
        NEXT_PUBLIC_BDAPPS_API_URL: ${NEXT_PUBLIC_BDAPPS_API_URL:-}
    container_name: watchlog-landing
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BDAPPS_APP_ID=${BDAPPS_APP_ID:-APP_139287}
      - BDAPPS_APP_PASSWORD=${BDAPPS_APP_PASSWORD:-a0f308c541496f23a4e96c9f42487f3e}
      - BDAPPS_BASE_URL=${BDAPPS_BASE_URL:-https://developer.bdapps.com}
      - BDAPPS_APP_HASH=${BDAPPS_APP_HASH:-WatchLog}
      - NEXT_PUBLIC_APK_DOWNLOAD_URL=${NEXT_PUBLIC_APK_DOWNLOAD_URL:-/app-release.apk}
      - NEXT_PUBLIC_BDAPPS_API_URL=${NEXT_PUBLIC_BDAPPS_API_URL:-}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
